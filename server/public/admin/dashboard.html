<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即时记账 · 开发者后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #333; }
.header { background: linear-gradient(135deg, #1a1a2e, #302b63); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .right { display: flex; align-items: center; gap: 12px; }
.header .logout-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.content { padding: 20px; max-width: 1400px; margin: 0 auto; }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-box { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.stat-box .label { font-size: 12px; color: #999; }
.stat-box .num { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-top: 4px; }

/* Controls */
.controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.controls .left { display: flex; align-items: center; gap: 8px; }
.controls .left select, .controls .left input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
.controls .left select:focus, .controls .left input:focus { border-color: #302b63; }
.controls .right { display: flex; gap: 8px; }
.controls .right button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: #302b63; color: #fff; }
.controls .right button:hover { opacity: 0.9; }

/* Table */
.table-wrap { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: #f8f9fa; }
th { padding: 10px 12px; text-align: left; font-weight: 600; color: #555; font-size: 12px; white-space: nowrap; cursor: pointer; user-select: none; }
th:hover { color: #302b63; }
td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
tr:hover td { background: #fafbff; }
tr:last-child td { border-bottom: none; }

/* Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 1px; }
.tag-zombie { background: #ffe0e0; color: #c00; }
.tag-vip { background: #fff3e0; color: #e65100; }
.tag-test { background: #e8f5e9; color: #2e7d32; }
.tag-default { background: #e3f2fd; color: #1565c0; }

/* Activity bar */
.activity-bar { display: inline-block; height: 6px; border-radius: 3px; background: #e0e0e0; width: 60px; vertical-align: middle; margin-right: 6px; }
.activity-bar .fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4CAF50, #8BC34A); }

/* Pagination */
.pagination { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #fff; border-top: 1px solid #f0f0f0; }
.pagination .info { font-size: 12px; color: #999; }
.pagination .btns { display: flex; gap: 4px; }
.pagination .btns button { padding: 4px 10px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
.pagination .btns button:hover { background: #f0f0f0; }
.pagination .btns button.active { background: #302b63; color: #fff; border-color: #302b63; }
.pagination .btns button:disabled { opacity: 0.4; cursor: default; }

/* Badge */
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
.badge-pro { background: #fff3e0; color: #e65100; }
.badge-free { background: #e8f5e9; color: #2e7d32; }
.badge-expired { background: #ffebee; color: #c62828; }

/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
.modal-head { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
.modal-head h3 { font-size: 16px; }
.modal-head .close { background: none; border: none; font-size: 20px; cursor: pointer; color: #999; padding: 4px; }
.modal-body { padding: 20px; }
.modal-body .row { display: flex; margin-bottom: 10px; }
.modal-body .row .lbl { width: 100px; color: #999; font-size: 13px; flex-shrink: 0; }
.modal-body .row .val { font-size: 13px; }
.modal-foot { padding: 12px 20px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 8px; }
.modal-foot button { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
.modal-foot .btn-primary { background: #302b63; color: #fff; }
.modal-foot .btn-cancel { background: #f0f0f0; color: #666; }

/* Input */
.input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; width: 100%; }
.input:focus { border-color: #302b63; }

/* Empty */
.empty { text-align: center; padding: 40px; color: #ccc; font-size: 14px; }

/* Children */
.children-wrap { margin-top: 4px; }
.children-toggle { font-size: 11px; color: #302b63; cursor: pointer; }
.children-toggle:hover { text-decoration: underline; }
.children-list { display: none; margin-top: 4px; padding-left: 20px; border-left: 2px solid #e0e0e0; }
.children-list.show { display: block; }
.child-item { padding: 3px 0; font-size: 12px; color: #666; }

/* Loading */
.loading { text-align: center; padding: 40px; color: #999; }
.loading::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
</head>
<body>
<div class="header">
  <h1>📊 即时记账 · 开发者后台</h1>
  <div class="right">
    <span id="userInfo" style="font-size:13px;opacity:0.8;"></span>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </div>
</div>

<div class="content">
  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Controls -->
  <div class="controls">
    <div class="left">
      <input type="text" id="searchInput" placeholder="搜索用户名..." oninput="debouncedLoad()">
      <select id="pageSizeSelect" onchange="loadUsers()">
        <option value="10">10条/页</option>
        <option value="20" selected>20条/页</option>
        <option value="50">50条/页</option>
        <option value="100">100条/页</option>
      </select>
      <select id="sortSelect" onchange="loadUsers()">
        <option value="newest">按注册时间↓</option>
        <option value="activity">按活跃度↓</option>
        <option value="name">按用户名↑</option>
      </select>
    </div>
    <div class="right">
      <button onclick="loadUsers()">🔄 刷新</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <div id="tableContent"><div class="loading">加载中</div></div>
  </div>
</div>

<!-- Modal: User Detail -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">用户详情</h3><button class="close" onclick="closeModal('userModal')">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal('userModal')">关闭</button>
    </div>
  </div>
</div>

<script>
const API = window.location.origin + '/api/v1/admin';
let token = localStorage.getItem('admin_token');
let currentPage = 1, totalUsers = 0;

function logout() { localStorage.removeItem('admin_token'); window.location.href = 'login.html'; }

async function apiFetch(url, opts = {}) {
  try {
    const headers = { ...opts.headers };
    headers['X-Admin-Token'] = token;
    if (!(opts.body instanceof FormData) && opts.body && typeof opts.body === 'object') {
      headers['Content-Type'] = 'application/json';
    }
    const res = await fetch(url, { ...opts, headers });
    if (res.status === 401) { logout(); return null; }
    return res.json();
  } catch(e) {
    console.error('API请求失败:', e);
    return null;
  }
}

function encodeName(name) {
  try { return decodeURIComponent(name || ''); } catch(e) { return name || ''; }
}

function getActivityBar(activityIndex) {
  const idx = parseInt(activityIndex) || 0;
  const pct = Math.min(idx / 20 * 100, 100);
  const color = idx === 0 ? '#e0e0e0' : idx < 5 ? '#FF9800' : idx < 15 ? '#8BC34A' : '#4CAF50';
  return `<div class="activity-bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div><span style="font-size:11px;color:#999">${idx}</span>`;
}

function getTagHtml(tags) {
  if (!tags) return '';
  return tags.split(',').filter(Boolean).map(t => {
    const cls = t.includes('僵尸') ? 'tag-zombie' : t.includes('VIP') || t.includes('vip') ? 'tag-vip' : t.includes('测试') ? 'tag-test' : 'tag-default';
    return `<span class="tag ${cls}">${t}</span>`;
  }).join('');
}

function getBadge(sub) {
  if (!sub || sub.plan_type === 'free') return '<span class="badge badge-free">免费</span>';
  if (sub.status === 'expired') return '<span class="badge badge-expired">已过期</span>';
  return '<span class="badge badge-pro">专业版</span>';
}

// === Dashboard ===
async function loadDashboard() {
  const data = await apiFetch(API + '/dashboard');
  if (!data) {
    document.getElementById('statsRow').innerHTML = '<div class="stat-box" style="grid-column:1/-1;text-align:center;color:#c00;">数据加载失败</div>';
    return;
  }
  const html = `
    <div class="stat-box"><div class="label">总用户</div><div class="num">${data.totalUsers}</div></div>
    <div class="stat-box"><div class="label">主账号</div><div class="num">${data.parentUsers}</div></div>
    <div class="stat-box"><div class="label">子账号</div><div class="num">${data.childUsers}</div></div>
    <div class="stat-box"><div class="label">专业版</div><div class="num">${data.proCount}</div></div>
    <div class="stat-box"><div class="label">免费版</div><div class="num">${data.freeCount}</div></div>
    <div class="stat-box"><div class="label">本月收入</div><div class="num">¥${data.thisMonthRevenue || 0}</div></div>
  `;
  document.getElementById('statsRow').innerHTML = html;
}

// === Users ===
async function loadUsers() {
  currentPage = 1;
  await fetchUsers();
}

async function fetchUsers() {
  const search = document.getElementById('searchInput').value;
  const limit = parseInt(document.getElementById('pageSizeSelect').value);
  const sort = document.getElementById('sortSelect').value;
  const offset = (currentPage - 1) * limit;
  
  let url = `${API}/users?page=${currentPage}&limit=${limit}&sort=${sort}`;
  if (search) url += '&search=' + encodeURIComponent(search);
  
  const data = await apiFetch(url);
  if (!data) return;
  
  totalUsers = data.total || 0;
  renderTable(data.users || [], data.total || 0, limit, sort);
}

function renderTable(users, total, limit, sort) {
  // Sort by activity if needed
  if (sort === 'activity') {
    users.sort((a, b) => (b.activity_index || 0) - (a.activity_index || 0));
  } else if (sort === 'name') {
    users.sort((a, b) => (a.login_name || '').localeCompare(b.login_name || ''));
  }
  
  if (!users.length) {
    document.getElementById('tableContent').innerHTML = '<div class="empty">暂无用户数据</div>';
    return;
  }
  
  let html = `<table>
    <thead><tr>
      <th onclick="sortBy('activity')">活跃度 ↕</th>
      <th onclick="sortBy('name')">登录账号 ↕</th>
      <th>显示名</th>
      <th>标签</th>
      <th>子账号</th>
      <th>门店</th>
      <th>订阅</th>
      <th>最近活跃</th>
      <th>操作</th>
    </tr></thead><tbody>`;
  
  for (const u of users) {
    const loginName = encodeName(u.login_name || u.display_name || '-');
    const displayName = encodeName(u.display_name || loginName);
    const children = u.children || [];
    
    html += `<tr>
      <td>${getActivityBar(u.activity_index || 0)}</td>
      <td><strong>${loginName}</strong></td>
      <td>
        <span style="cursor:pointer;color:#302b63;" onclick="editDisplayName('${u.id}','${displayName.replace(/'/g,"\\'")}')">${displayName}</span>
        <span style="font-size:10px;color:#999;cursor:pointer;margin-left:4px;" onclick="showNameHistory('${u.id}')">📋</span>
      </td>
      <td>${getTagHtml(u.tags)}
        <span style="font-size:10px;color:#999;cursor:pointer;" onclick="showTagsModal('${u.id}','${displayName.replace(/'/g,"\\'")}')">+</span>
      </td>
      <td>${u.subAccountCount || 0}</td>
      <td>${u.storeCount || 0}</td>
      <td>${getBadge(u.subscription)}</td>
      <td style="font-size:11px;color:#999">${u.last_active ? new Date(u.last_active).toLocaleDateString() : '-'}</td>
      <td>
        <span style="font-size:11px;color:#302b63;cursor:pointer;" onclick="showUserDetail('${u.id}')">详情</span>
        ${u.subAccountCount > 0 ? `<span style="font-size:11px;color:#999;cursor:pointer;margin-left:6px;" onclick="toggleChildren('${u.id}')">子账号▸</span>` : ''}
      </td>
    </tr>`;
    
    // Children rows (hidden by default)
    if (children.length > 0) {
      html += `<tr id="children-${u.id}" style="display:none;">
        <td colspan="9" style="padding:0;">
          <div class="children-wrap" style="padding:8px 12px;background:#fafbff;">
            <div style="font-size:11px;color:#999;margin-bottom:4px;">子账号列表：</div>
            ${children.map(function(c) { return `
              <div class="child-item" style="display:flex;gap:12px;padding:2px 0;">
                <span>${encodeName(c.display_name || c.login_name || '-')}</span>
                <span style="color:#999;font-size:11px;">${c.plan_type === 'pro' ? '专业版' : '免费'}</span>
              </div>
            `; }).join('')}
          </div>
        </td>
      </tr>`;
    }
  }
  
  html += '</tbody></table>';
  
  // Pagination
  const totalPages = Math.ceil(total / limit);
  let pagination = `<div class="pagination">
    <div class="info">共 ${total} 条，第 ${currentPage}/${totalPages} 页</div>
    <div class="btns">
      <button onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>
      ${getPageButtons(currentPage, totalPages)}
      <button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>
    </div>
  </div>`;
  
  document.getElementById('tableContent').innerHTML = html + pagination;
}

function getPageButtons(current, total) {
  let btns = '';
  const start = Math.max(1, current - 2);
  const end = Math.min(total, current + 2);
  for (let i = start; i <= end; i++) {
    btns += `<button class="${i === current ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  return btns;
}

function goPage(page) {
  if (page < 1) return;
  currentPage = page;
  fetchUsers();
}

function toggleChildren(userId) {
  const el = document.getElementById('children-' + userId);
  if (el) el.style.display = el.style.display === 'none' ? 'table-row' : 'none';
}

function sortBy(type) {
  const sel = document.getElementById('sortSelect');
  if (type === 'activity') sel.value = 'activity';
  else if (type === 'name') sel.value = 'name';
  else sel.value = 'newest';
  loadUsers();
}

// === User Detail ===
async function showUserDetail(userId) {
  const data = await apiFetch(`${API}/users/${userId}`);
  if (!data || !data.id) return;
  
  const u = data;
  const loginName = encodeName(u.login_name || u.display_name || '-');
  const displayName = encodeName(u.display_name || loginName);
  const children = u.children || [];
  
  document.getElementById('modalTitle').textContent = '用户详情 - ' + loginName;
  
  document.getElementById('modalBody').innerHTML = `
    <div class="row"><div class="lbl">登录账号</div><div class="val">${loginName}</div></div>
    <div class="row"><div class="lbl">显示名</div><div class="val">
      <span style="cursor:pointer;color:#302b63;" onclick="editDisplayName('${u.id}','${displayName.replace(/'/g,"\\'")}')">${displayName}</span>
      <span style="font-size:10px;color:#999;cursor:pointer;margin-left:4px;" onclick="showNameHistory('${u.id}')">📋历史</span>
    </div></div>
    <div class="row"><div class="lbl">活跃指数</div><div class="val">${getActivityBar(u.activity_index || 0)}</div></div>
    <div class="row"><div class="lbl">标签</div><div class="val">${getTagHtml(u.tags)}
      <span style="font-size:10px;color:#999;cursor:pointer;" onclick="showTagsModal('${u.id}','${displayName.replace(/'/g,"\\'")}')">+</span>
    </div></div>
    <div class="row"><div class="lbl">订阅</div><div class="val">${getBadge(u.subscription)}</div></div>
    <div class="row"><div class="lbl">子账号</div><div class="val">${u.subAccountCount || 0}</div></div>
    <div class="row"><div class="lbl">门店</div><div class="val">${u.storeCount || 0}</div></div>
    <div class="row"><div class="lbl">交易数</div><div class="val">${u.txCount || 0}（本周 ${u.weekTxCount || 0}）</div></div>
    <div class="row"><div class="lbl">最近活跃</div><div class="val">${u.last_active ? new Date(u.last_active).toLocaleString() : '无记录'}</div></div>
    
    ${children.length > 0 ? `
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0;">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;">子账号列表</div>
      ${children.map(function(c) { return `
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid #f5f5f5;">
          <span>${encodeName(c.display_name || c.login_name || '-')}</span>
          <span style="color:#999;font-size:11px;">${c.plan_type === 'pro' ? '专业版' : '免费'}</span>
        </div>
      `; }).join('')}
    </div>` : ''}
    
    ${u.last_active ? '' : '<div style="margin-top:12px;padding:8px 12px;background:#fff3e0;border-radius:6px;font-size:12px;color:#e65100;">⚠️ 该用户可能为僵尸号（无活跃记录）</div>'}
  `;
  
  document.getElementById('userModal').classList.add('show');
}

// === Display Name Edit ===
function editDisplayName(userId, currentName) {
  const newName = prompt('请输入新的显示名：', currentName);
  if (!newName || newName === currentName) return;
  apiFetch(`${API}/users/${userId}/display-name`, {
    method: 'PUT',
    body: JSON.stringify({ display_name: newName }),
  }).then(r => {
    if (r) { loadUsers(); }
  });
}

async function showNameHistory(userId) {
  const data = await apiFetch(`${API}/users/${userId}/display-name-history`);
  if (!data) return;
  const history = data.history || [];
  let html = `<div style="margin-bottom:12px;font-size:14px;font-weight:600;">用户名修改历史</div>`;
  if (history.length === 0) {
    html += '<div style="color:#999;padding:20px;text-align:center;">暂无修改记录</div>';
  } else {
    html += `<table style="width:100%;font-size:13px;"><thead><tr><th>时间</th><th>旧名称</th><th>新名称</th></tr></thead><tbody>`;
    for (const h of history) {
      html += `<tr><td style="color:#999;font-size:11px;">${new Date(h.created_at).toLocaleString()}</td><td>${h.old_name || '-'}</td><td>${h.new_name}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  showModal('用户名修改历史', html);
}

// === Tags ===
async function showTagsModal(userId, userName) {
  const data = await apiFetch(`${API}/users/${userId}/tags`);
  const tags = data?.tags || [];
  let html = `<div style="margin-bottom:12px;font-size:14px;font-weight:600;">标签管理 - ${userName}</div>`;
  html += `<div style="display:flex;gap:8px;margin-bottom:12px;">
    <input class="input" id="tagInput" placeholder="输入标签名称" style="flex:1;" onkeydown="if(event.key==='Enter')addTag('${userId}')">
    <button onclick="addTag('${userId}')" style="padding:8px 16px;background:#302b63;color:#fff;border:none;border-radius:6px;cursor:pointer;">添加</button>
  </div>`;
  if (tags.length === 0) {
    html += '<div style="color:#999;padding:20px;text-align:center;">暂无标签，请添加</div>';
  } else {
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    for (const t of tags) {
      html += `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#f0f0f0;border-radius:4px;font-size:13px;">
        ${t.tag}
        <span style="cursor:pointer;color:#c00;font-size:14px;" onclick="removeTag('${userId}','${t.tag}')">&times;</span>
      </span>`;
    }
    html += '</div>';
  }
  showModal('标签管理', html);
}

async function addTag(userId) {
  const input = document.getElementById('tagInput');
  const tag = input.value.trim();
  if (!tag) return;
  await apiFetch(`${API}/users/${userId}/tags`, { method: 'POST', body: JSON.stringify({ tag }) });
  showTagsModal(userId, '');
}

async function removeTag(userId, tag) {
  await apiFetch(`${API}/users/${userId}/tags/${encodeURIComponent(tag)}`, { method: 'DELETE' });
  showTagsModal(userId, '');
}

// === Utility ===
function showModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('userModal').classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// Click outside to close modal
document.getElementById('userModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('userModal');
});

// Debounce
let debounceTimer;
function debouncedLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => loadUsers(), 300);
}

// === Init ===
async function init() {
  if (!token) { window.location.href = 'login.html'; return; }
  document.getElementById('userInfo').textContent = '管理员';
  try {
    await loadDashboard();
    await loadUsers();
  } catch(e) {
    console.error('初始化失败:', e);
    document.getElementById('tableContent').innerHTML = '<div class="empty" style="color:#c00;">数据加载失败，请检查网络或刷新重试</div>';
  }
}

init();
</script>
</body>
</html>
