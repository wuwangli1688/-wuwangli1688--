<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即时记账 · 管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 400px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-card h1 {
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 4px;
      text-align: center;
    }
    .login-card .subtitle {
      font-size: 14px;
      color: #64748b;
      text-align: center;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-msg {
      color: #ef4444;
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .error-msg.show { display: block; }
    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .loading.show { display: flex; }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>📊 即时记账</h1>
    <p class="subtitle">管理后台 · 请使用主账号登录</p>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>邮箱 / 账号</label>
        <input type="text" id="account" placeholder="请输入邮箱或账号" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span id="btnText">登 录</span>
        <span class="loading" id="loadingSpinner">
          <span class="spinner"></span>
          登录中...
        </span>
      </button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://isltlzbishsogxbdzxnf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_99qkb4W3xKdrCrMae4RSFA_lDWS7TV_';

    async function handleLogin(e) {
      e.preventDefault();
      const account = document.getElementById('account').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('loadingSpinner');
      const errorMsg = document.getElementById('errorMsg');

      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.classList.add('show');
      errorMsg.classList.remove('show');

      try {
        // 通过 Supabase 登录
        const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ email: account, password }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error_description || data.msg || '登录失败，请检查账号密码');
        }

        // 检查是否是主账号
        const userResp = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${data.user.id}&select=role`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${data.access_token}`,
          }
        });
        const profiles = await userResp.json();
        const profile = profiles?.[0];

        if (!profile || profile.role !== 'parent') {
          throw new Error('仅主账号可登录管理后台');
        }

        // 保存 session 到 localStorage
        localStorage.setItem('admin_token', data.access_token);
        localStorage.setItem('admin_refresh_token', data.refresh_token);
        localStorage.setItem('admin_user', JSON.stringify({
          id: data.user.id,
          email: data.user.email,
        }));

        // 跳转到仪表盘
        window.location.href = '/admin/dashboard.html';

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add('show');
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.classList.remove('show');
      }
    }
  </script>
</body>
</html>
