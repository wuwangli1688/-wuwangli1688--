<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即时记账 · 开发者后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-box {
  background: rgba(255,255,255,0.95);
  border-radius: 20px; padding: 40px; width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-box h1 { text-align: center; font-size: 22px; color: #1a1a2e; margin-bottom: 5px; }
.login-box .subtitle { text-align: center; font-size: 13px; color: #888; margin-bottom: 30px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; font-weight: 500; }
.form-group input {
  width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px;
  font-size: 15px; outline: none; transition: border-color 0.2s;
}
.form-group input:focus { border-color: #302b63; }
.login-btn {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #302b63, #24243e);
  color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s; margin-top: 10px;
}
.login-btn:hover { opacity: 0.9; }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
.loading { text-align: center; font-size: 13px; color: #888; margin-top: 12px; display: none; }
.footer { text-align: center; margin-top: 20px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div class="login-box">
  <h1>🔒 开发者后台</h1>
  <div class="subtitle">即时记账 · 管理系统</div>
  <div class="form-group">
    <label>开发者账号</label>
    <input type="text" id="username" placeholder="请输入开发者账号" autocomplete="username">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
  </div>
  <button class="login-btn" id="loginBtn" onclick="handleLogin()">登 录</button>
  <div class="error" id="errorMsg"></div>
  <div class="loading" id="loadingText">正在登录...</div>
  <div class="footer">仅限开发者使用</div>
</div>
<script>
const API = '/api/v1/admin';

async function handleLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('loginBtn');
  const error = document.getElementById('errorMsg');
  const loading = document.getElementById('loadingText');

  if (!username || !password) {
    showError('请输入账号和密码');
    return;
  }

  btn.disabled = true;
  loading.style.display = 'block';
  error.style.display = 'none';

  try {
    const res = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem('admin_token', data.token);
      localStorage.setItem('admin_username', username);
      window.location.href = '/api/v1/admin/dashboard';
    } else {
      showError(data.error || '登录失败，请检查账号密码');
    }
  } catch (e) {
    showError('网络错误，请检查服务器连接');
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
